[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lestinxor"
version = "0.3.0"
description = "Lestinxor — grand orchestrator: evolutionary outer-loop thought search over gated inner-loop Gauntlet runs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonny" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
lestinxor = "lestinxor.cli:main"

[project.urls]
Repository = "https://github.com/jonnysteedman683-wq/LESTINXOR-AGENT"

[tool.setuptools.packages.find]
include = ["lestinxor*"]

[tool.setuptools.package-data]
lestinxor = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "E731", "E741"]
# Vendored byte-identical from Sebastian; its noqa targets py311 rules that never fire on py310.
"lestinxor/gauntlet_core.py" = ["RUF100"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["lestinxor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 85
show_missing = true
